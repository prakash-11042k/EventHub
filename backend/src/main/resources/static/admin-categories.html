<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - EventHub Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">EventHub <span style="font-size: 0.8rem; color: var(--text-secondary); margin-left: 0.5rem;">Admin</span></a>
            <div class="nav-links" id="dynamic-nav"></div>
        </div>
    </nav>

    <main class="container">
        <div class="flex justify-between items-center mb-4">
            <h2>Manage Categories</h2>
            <div class="flex gap-2">
                <a href="admin-dashboard.html" class="btn btn-secondary">Dashboard</a>
                <a href="admin-events.html" class="btn btn-secondary">Events</a>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div style="grid-column: span 1;">
                <div class="card" style="padding: 1.5rem;">
                    <h3 class="mb-3" id="form-title">Add Category</h3>
                    <form id="category-form">
                        <input type="hidden" id="cat-id">
                        <div class="form-group">
                            <label class="form-label">Name</label>
                            <input type="text" id="cat-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea id="cat-desc" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
                            <button type="button" class="btn btn-secondary hidden" id="cancel-btn" onclick="resetForm()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
            <div style="grid-column: span 2;">
                <div class="card" style="padding: 1.5rem;">
                    <table id="categories-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categories-body">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 EventHub. All rights reserved.</p></div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!api.isAdmin()) window.location.href = 'index.html';

        document.addEventListener('DOMContentLoaded', loadCategories);

        async function loadCategories() {
            try {
                const categories = await api.fetchAPI('/categories');
                const tbody = document.getElementById('categories-body');
                tbody.innerHTML = categories.map(cat => `
                    <tr>
                        <td><strong>${cat.name}</strong></td>
                        <td>${cat.description || ''}</td>
                        <td>
                            <button onclick="editCategory(${cat.id}, '${cat.name.replace(/'/g, "\\'")}', '${(cat.description || '').replace(/'/g, "\\'")}')" class="btn btn-secondary">Edit</button>
                            <button onclick="deleteCategory(${cat.id})" class="btn btn-danger">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                showNotification('Failed to load categories', 'error');
            }
        }

        document.getElementById('category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('cat-id').value;
            const payload = {
                name: document.getElementById('cat-name').value,
                description: document.getElementById('cat-desc').value
            };
            
            try {
                if (id) {
                    await api.fetchAPI(`/categories/${id}`, { method: 'PUT', body: payload });
                    showNotification('Category updated', 'success');
                } else {
                    await api.fetchAPI('/categories', { method: 'POST', body: payload });
                    showNotification('Category added', 'success');
                }
                resetForm();
                loadCategories();
            } catch (error) {
                showNotification(error.message, 'error');
            }
        });

        function editCategory(id, name, desc) {
            document.getElementById('form-title').textContent = 'Edit Category';
            document.getElementById('cat-id').value = id;
            document.getElementById('cat-name').value = name;
            document.getElementById('cat-desc').value = desc;
            document.getElementById('cancel-btn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('category-form').reset();
            document.getElementById('cat-id').value = '';
            document.getElementById('form-title').textContent = 'Add Category';
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        async function deleteCategory(id) {
            if (!confirm('Delete this category? This might fail if events are linked to it.')) return;
            try {
                await api.fetchAPI(`/categories/${id}`, { method: 'DELETE' });
                showNotification('Category deleted', 'success');
                loadCategories();
            } catch (error) {
                showNotification('Cannot delete category in use', 'error');
            }
        }
    </script>
</body>
</html>
