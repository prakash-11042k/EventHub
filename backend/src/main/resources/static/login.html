<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EventHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body style="background-color: var(--bg-color);">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                EventHub
            </a>
            <div class="nav-links" id="dynamic-nav"></div>
        </div>
    </nav>

    <main class="flex items-center" style="justify-content: center;">
        <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
            <h2 class="text-center mb-4">Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
            </form>
            <p class="text-center mt-3 text-muted">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (api.isLoggedIn()) {
            window.location.href = 'index.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const data = await api.fetchAPI('/auth/login', {
                    method: 'POST',
                    body: { email, password }
                });
                
                api.setAuth(data.token, data);
                showNotification('Login successful!', 'success');
                setTimeout(() => window.location.href = 'events.html', 1000);
            } catch (error) {
                showNotification(error.message || 'Login failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
