<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events - EventHub Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">EventHub <span style="font-size: 0.8rem; color: var(--text-secondary); margin-left: 0.5rem;">Admin</span></a>
            <div class="nav-links" id="dynamic-nav"></div>
        </div>
    </nav>

    <main class="container">
        <div class="flex justify-between items-center mb-4">
            <h2>Manage Events</h2>
            <div class="flex gap-2">
                <a href="admin-dashboard.html" class="btn btn-secondary">Dashboard</a>
                <a href="admin-categories.html" class="btn btn-secondary">Categories</a>
                <button onclick="openModal()" class="btn btn-primary">Add New Event</button>
            </div>
        </div>

        <div class="card" style="padding: 1.5rem; overflow-x: auto;">
            <table id="events-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Date & Time</th>
                        <th>Category</th>
                        <th>Capacity</th>
                        <th>Avail</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="events-body">
                    <!-- Dynamic -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Event Form Modal -->
    <div id="event-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 class="mb-3" id="modal-title">Create Event</h2>
            <form id="event-form">
                <input type="hidden" id="event-id">
                
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" id="ev-title" class="form-control" required>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="form-label">Category</label>
                        <select id="ev-category" class="form-control" required></select>
                    </div>
                    <div>
                        <label class="form-label">Capacity</label>
                        <input type="number" id="ev-capacity" class="form-control" required min="1">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4 mb-3">
                    <div>
                        <label class="form-label">Date</label>
                        <input type="date" id="ev-date" class="form-control" required>
                    </div>
                    <div>
                        <label class="form-label">Start Time</label>
                        <input type="time" id="ev-start" class="form-control" required>
                    </div>
                    <div>
                        <label class="form-label">End Time</label>
                        <input type="time" id="ev-end" class="form-control" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-3">
                    <div>
                        <label class="form-label">Location (City)</label>
                        <input type="text" id="ev-location" class="form-control" required>
                    </div>
                    <div>
                        <label class="form-label">Venue</label>
                        <input type="text" id="ev-venue" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="ev-desc" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Image URL</label>
                    <input type="url" id="ev-image" class="form-control">
                </div>

                <div class="flex justify-between mt-4">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container"><p>&copy; 2026 EventHub. All rights reserved.</p></div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (!api.isAdmin()) window.location.href = 'index.html';
        
        let allEvents = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategories();
            await loadEvents();
        });

        async function loadCategories() {
            try {
                const cats = await api.fetchAPI('/categories');
                const select = document.getElementById('ev-category');
                select.innerHTML = '<option value="">Select Category</option>' + 
                    cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (e) { console.error(e); }
        }

        async function loadEvents() {
            try {
                allEvents = await api.fetchAPI('/events');
                const tbody = document.getElementById('events-body');
                tbody.innerHTML = allEvents.map(e => `
                    <tr>
                        <td><strong>${e.title}</strong></td>
                        <td>${formatDate(e.eventDate)} ${formatTime(e.startTime)}</td>
                        <td><span class="badge badge-success">${e.categoryName}</span></td>
                        <td>${e.capacity}</td>
                        <td>${e.availableSeats}</td>
                        <td>
                            <button onclick="editEvent(${e.id})" class="btn btn-secondary">Edit</button>
                            <button onclick="deleteEvent(${e.id})" class="btn btn-danger">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                showNotification('Failed to load events', 'error');
            }
        }

        function openModal() {
            document.getElementById('event-modal').classList.remove('hidden');
            document.getElementById('event-form').reset();
            document.getElementById('event-id').value = '';
            document.getElementById('modal-title').textContent = 'Create Event';
        }

        function closeModal() {
            document.getElementById('event-modal').classList.add('hidden');
        }

        function editEvent(id) {
            const ev = allEvents.find(e => e.id === id);
            if (!ev) return;
            
            document.getElementById('event-id').value = ev.id;
            document.getElementById('ev-title').value = ev.title;
            document.getElementById('ev-category').value = ev.categoryId;
            document.getElementById('ev-capacity').value = ev.capacity;
            document.getElementById('ev-date').value = ev.eventDate;
            document.getElementById('ev-start').value = ev.startTime;
            document.getElementById('ev-end').value = ev.endTime;
            document.getElementById('ev-location').value = ev.location;
            document.getElementById('ev-venue').value = ev.venue;
            document.getElementById('ev-desc').value = ev.description;
            document.getElementById('ev-image').value = ev.imageUrl || '';
            
            document.getElementById('modal-title').textContent = 'Edit Event';
            document.getElementById('event-modal').classList.remove('hidden');
        }

        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('event-id').value;
            const payload = {
                title: document.getElementById('ev-title').value,
                categoryId: parseInt(document.getElementById('ev-category').value),
                capacity: parseInt(document.getElementById('ev-capacity').value),
                eventDate: document.getElementById('ev-date').value,
                startTime: document.getElementById('ev-start').value + ':00',
                endTime: document.getElementById('ev-end').value + ':00',
                location: document.getElementById('ev-location').value,
                venue: document.getElementById('ev-venue').value,
                description: document.getElementById('ev-desc').value,
                imageUrl: document.getElementById('ev-image').value,
                organizer: 'EventHub Admin' // Default or fetch from profile
            };
            
            const btn = document.getElementById('save-btn');
            btn.disabled = true;

            try {
                if (id) {
                    await api.fetchAPI(`/events/${id}`, { method: 'PUT', body: payload });
                    showNotification('Event updated', 'success');
                } else {
                    await api.fetchAPI('/events', { method: 'POST', body: payload });
                    showNotification('Event created', 'success');
                }
                closeModal();
                loadEvents();
            } catch (error) {
                showNotification(error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        async function deleteEvent(id) {
            if (!confirm('Are you sure you want to delete this event? This will fail if there are registrations.')) return;
            
            try {
                await api.fetchAPI(`/events/${id}`, { method: 'DELETE' });
                showNotification('Event deleted', 'success');
                loadEvents();
            } catch (error) {
                showNotification('Failed to delete event. It might have active registrations.', 'error');
            }
        }
    </script>
</body>
</html>
