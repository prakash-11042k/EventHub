<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body style="background-color: var(--bg-color);">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                EventHub
            </a>
            <div class="nav-links" id="dynamic-nav"></div>
        </div>
    </nav>

    <main class="flex items-center" style="justify-content: center;">
        <div class="card" style="width: 100%; max-width: 450px; padding: 2rem;">
            <h2 class="text-center mb-4">Create an Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="register-btn">Register</button>
            </form>
            <p class="text-center mt-3 text-muted">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        if (api.isLoggedIn()) {
            window.location.href = 'index.html';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };
            const btn = document.getElementById('register-btn');
            
            btn.disabled = true;
            btn.textContent = 'Registering...';

            try {
                const data = await api.fetchAPI('/auth/register', {
                    method: 'POST',
                    body: payload
                });
                
                api.setAuth(data.token, data);
                showNotification('Registration successful!', 'success');
                setTimeout(() => window.location.href = 'events.html', 1000);
            } catch (error) {
                showNotification(error.message || 'Registration failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        });
    </script>
</body>
</html>
