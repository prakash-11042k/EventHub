spring.application.name=eventhub

# Optional local overrides for developer-specific credentials (git-ignored)
spring.config.import=optional:application-local.properties

# Database Configuration (Environment variables with safe local defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventhub?sslMode=PREFERRED&autoReconnect=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=150000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration (Supports Render PORT dynamically with local fallback)
server.port=8081

# JWT Configuration (Override in production via JWT_SECRET)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}


